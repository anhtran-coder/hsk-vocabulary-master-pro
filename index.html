<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Luyện gõ Pinyin & Từ Vựng Tiếng Trung</title>
    <!-- Thư viện đọc file Excel SheetJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary-color: #ec4899;
            --primary-hover: #db2777;
            --bg-gradient: linear-gradient(135deg, #fce7f3 0%, #fbcfe8 100%);
            --card-bg: rgba(255, 255, 255, 0.96);
            --text-color: #1f2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        .snowflake-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .snowflake {
            position: absolute;
            top: -10vh;
            animation-name: fall, sway;
            animation-timing-function: linear, ease-in-out;
            animation-iteration-count: infinite, infinite;
            user-select: none;
            opacity: 0.3; 
        }

        @keyframes fall {
            0% { top: -10vh; }
            100% { top: 110vh; }
        }

        @keyframes sway {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(20px); }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(236, 72, 153, 0.15);
            padding: 25px;
            position: relative;
            z-index: 2;
            backdrop-filter: blur(5px);
        }

        h1 {
            text-align: center;
            color: #be185d;
            margin-bottom: 20px;
            font-size: 1.8rem;
        }

        .controls-section {
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.92rem;
        }

        .control-group label {
            font-weight: 600;
            color: #4b5563;
        }

        input[type="number"], select {
            padding: 6px 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            outline: none;
            font-size: 0.9rem;
        }

        input[type="number"] {
            width: 70px;
        }

        .btn-excel {
            background-color: #059669;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .btn-excel:hover { background-color: #047857; }

        .btn-new {
            background-color: #6366f1;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-new:hover { background-color: #4f46e5; }

        .btn-retry {
            background-color: #d97706;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-retry:hover { background-color: #b45309; }

        .btn-mistake {
            background-color: #e11d48;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-mistake:hover { background-color: #be123c; }

        .btn-reset {
            background-color: #dc2626;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-reset:hover { background-color: #b91c1c; }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fdf2f8;
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
            color: #831843;
            flex-wrap: wrap;
            gap: 10px;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: #e5e7eb;
            border-radius: 4px;
            margin-top: 8px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: var(--primary-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            table-layout: fixed;
        }

        th, td {
            padding: 12px 10px;
            text-align: center;
            border-bottom: 1px solid #f3f4f6;
            font-size: 0.95rem;
            word-wrap: break-word;
            white-space: normal;
            vertical-align: middle;
        }

        th {
            background-color: #e0e7ff;
            color: #3730a3;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        tr.row-correct {
            background-color: #d1fae5 !important;
        }

        tr.row-wrong {
            background-color: #fee2e2 !important;
        }

        .col-stt { width: 50px; font-weight: 600; color: #4b5563; }
        .col-hanzi { width: 20%; font-size: 1.25rem; font-weight: 700; color: #111827; line-height: 1.4; }
        .col-type { width: 15%; color: #4b5563; font-weight: 500; font-size: 0.92rem; }
        .col-pinyin { width: 18%; color: #4b5563; font-weight: 500; line-height: 1.4; }
        .col-viet { width: 22%; color: #1f2937; font-weight: 500; line-height: 1.4; }
        .col-input { width: 25%; }

        .col-input textarea { 
            width: 100%;
            min-height: 42px;
            padding: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            text-align: center;
            font-size: 0.95rem;
            resize: none;
            overflow: hidden;
            font-family: inherit;
            line-height: 1.3;
            display: block;
        }

        .col-input textarea:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.2);
            outline: none;
        }

        .audio-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 2px 6px;
            margin-left: 4px;
            border-radius: 4px;
            display: inline-block;
        }
        .audio-btn:hover {
            background: #f1f5f9;
        }

        #loadingStatus {
            font-size: 0.88rem;
            font-weight: bold;
            margin-left: 8px;
        }

        @media screen and (max-width: 768px) {
            body { padding: 6px; overflow-x: hidden; }
            .container { padding: 12px 6px; border-radius: 10px; }
            h1 { font-size: 1.25rem; margin-bottom: 12px; }
            .controls-section { flex-direction: column; align-items: stretch; gap: 10px; padding: 10px; }
            .control-group { justify-content: space-between; width: 100%; }
            .stats-bar { flex-direction: column; align-items: flex-start; gap: 6px; padding: 10px; font-size: 0.85rem; }
            
            table { font-size: 0.85rem; table-layout: auto; }
            th, td { padding: 8px 4px; }
            .col-stt { width: 35px; }
            .col-hanzi { font-size: 1.05rem; }
            
            .col-input textarea { 
                padding: 6px 4px; 
                font-size: 16px !important;
                min-height: 38px;
            }
        }
    </style>
</head>
<body>

    <div id="snowflakeContainer" class="snowflake-container"></div>

    <div class="container">
        <h1>🌸 Luyện Gõ Pinyin & Từ Vựng Tiếng Trung 🌸</h1>

        <div class="controls-section">
            <div class="control-group">
                <label class="btn-excel" onclick="document.getElementById('excelFile').click()">
                    📁 Chọn Excel
                </label>
                <input type="file" id="excelFile" accept=".xlsx, .xls" style="display: none;">
                <span id="loadingStatus"></span>
            </div>

            <div class="control-group">
                <label>🎯 Chế độ:</label>
                <select id="modeSelect">
                    <option value="chinese_to_viet">Hán Tự ➔ Gõ Nghĩa TV</option>
                    <option value="viet_to_chinese">Nghĩa TV ➔ Gõ Hán/Pinyin</option>
                    <option value="listening_mode">🔊 Luyện Nghe ➔ Gõ Từ</option>
                </select>
            </div>

            <div class="control-group">
                <label>🔄 Trộn câu:</label>
                <select id="shuffleSelect">
                    <option value="random">Ngẫu nhiên (Fisher-Yates)</option>
                    <option value="sequential">Theo thứ tự</option>
                </select>
            </div>

            <div class="control-group">
                <label>📝 Số câu:</label>
                <input type="number" id="quizSize" value="10" min="1" max="100">
            </div>

            <div class="control-group">
                <label>⚡ Tốc độ:</label>
                <select id="speedSelect">
                    <option value="1.0">1.0x</option>
                    <option value="0.75">0.75x</option>
                    <option value="0.5">0.5x</option>
                </select>
            </div>

            <div class="control-group">
                <button id="btnAudioToggle" class="btn-new" style="background-color: #db2777;">🔊 Âm thanh</button>
            </div>
        </div>

        <div class="controls-section" style="margin-top: -10px;">
            <div class="control-group">
                <label>📊 Khoảng:</label>
                <input type="number" id="rangeFrom" value="1" min="1">
                <label>đến</label>
                <input type="number" id="rangeTo" value="40" min="1">
            </div>

            <div class="control-group" style="margin-left: auto; gap: 10px;">
                <button id="btnNewQuiz" class="btn-new">⚡ Đổi đề</button>
                <button id="btnRetryQuiz" class="btn-retry">♻️ Làm lại</button>
                <button id="btnMistakeQuiz" class="btn-mistake">📖 Sổ từ sai (<span id="wrongCount">0</span>)</button>
                <button id="btnReset" class="btn-reset">🗑️ Xóa data</button>
            </div>
        </div>

        <div class="stats-bar">
            <div>Tổng số: <span id="statTotal">0</span></div>
            <div>Đã làm: <span id="statDone">0</span></div>
            <div>Đúng: <span id="statCorrect" style="color: #059669;">0</span></div>
            <div>Sai: <span id="statWrong" style="color: #dc2626;">0</span></div>
            <div>Tỷ lệ đúng: <span id="statRate">0.0%</span></div>
            <div>⏱️ Thời gian: <span id="timerDisplay">00:00</span></div>
            <div class="progress-bar-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th class="col-stt">STT</th>
                        <th class="col-hanzi">CHỮ HÁN</th>
                        <th class="col-type">LOẠI TỪ</th>
                        <th class="col-pinyin">PINYIN</th>
                        <th class="col-viet">TIẾNG VIỆT</th>
                        <th class="col-input">Ô NHẬP</th>
                    </tr>
                </thead>
                <tbody id="vocabTable"></tbody>
            </table>
        </div>
    </div>

    <script>
        function createSnowflakes() {
            const container = document.getElementById('snowflakeContainer');
            if (!container) return;
            container.innerHTML = '';
            const icons = ['🌸', '❄', '🌸', '❆', '🌺'];
            const isMobile = window.innerWidth <= 768;
            const count = isMobile ? 35 : 80; 
            
            const fragment = document.createDocumentFragment();

            for (let i = 0; i < count; i++) {
                const flake = document.createElement('div');
                flake.className = 'snowflake';
                flake.innerText = icons[Math.floor(Math.random() * icons.length)];
                
                const leftPos = Math.random() * 100;
                const duration = 7 + Math.random() * 8;
                const delay = Math.random() * 8;
                const size = 0.5 + Math.random() * 0.7;
                
                flake.style.left = `${leftPos}%`;
                flake.style.animationDuration = `${duration}s, 4s`;
                flake.style.animationDelay = `${delay}s, ${delay}s`;
                flake.style.fontSize = `${size}em`;
                
                fragment.appendChild(flake);
            }
            container.appendChild(fragment);
        }
        createSnowflakes();

        const EMBEDDED_VOCAB_DATA = [
            {"chinese": "年", "type": "Danh từ", "pinyin": "nián", "meaning": "Năm"},
            {"chinese": "今年", "type": "Danh từ chỉ thời gian", "pinyin": "jīnnián", "meaning": "Năm nay"},
            {"chinese": "明年", "type": "Danh từ chỉ thời gian", "pinyin": "míngnián", "meaning": "Năm sau, sang năm"},
            {"chinese": "后年", "type": "Danh từ chỉ thời gian", "pinyin": "hòunián", "meaning": "Năm sau nữa"},
            {"chinese": "去年", "type": "Danh từ chỉ thời gian", "pinyin": "qùnián", "meaning": "Năm ngoái"},
            {"chinese": "毕业", "type": "Động từ (ly hợp)", "pinyin": "bìyè", "meaning": "Tốt nghiệp"},
            {"chinese": "多", "type": "Phó từ / Tính từ", "pinyin": "duō", "meaning": "Nhiều, hơn"},
            {"chinese": "多大", "type": "Cụm từ hỏi", "pinyin": "duōdà", "meaning": "Bao nhiêu tuổi"},
            {"chinese": "岁", "type": "Lượng từ", "pinyin": "suì", "meaning": "Tuổi"},
            {"chinese": "属", "type": "Động từ", "pinyin": "shǔ", "meaning": "Cầm tinh, thuộc về"}
        ];

        const SECRET_Z1_KEY = "CAMTU2019S2THANHAN2025"; 

        let fullVocabData = [];
        let currentQuizData = [];
        
        let wrongWordsByMode = {
            "chinese_to_viet": {},
            "viet_to_chinese": {},
            "listening_mode": {}
        };

        let activeAudioText = ""; 
        let timerInterval = null;
        let secondsElapsed = 0;
        let isTimerRunning = false;
        let sequentialOffset = 0;
        let isAudioEnabled = true;
        let isMistakeMode = false;

        function fisherYatesShuffle(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        const btnAudioToggle = document.getElementById('btnAudioToggle');
        if (btnAudioToggle) {
            btnAudioToggle.addEventListener('click', function() {
                isAudioEnabled = !isAudioEnabled;
                if (isAudioEnabled) {
                    btnAudioToggle.innerHTML = "🔊 Âm thanh";
                    btnAudioToggle.style.backgroundColor = "#db2777";
                    speakText("好");
                } else {
                    btnAudioToggle.innerHTML = "🔇 Âm thanh";
                    btnAudioToggle.style.backgroundColor = "#9ca3af";
                }
            });
        }

        let speechTimeout = null;
        function speakText(text) {
            if (!isAudioEnabled || !text) return;
            if (!('speechSynthesis' in window)) return;

            window.speechSynthesis.cancel();
            if (speechTimeout) clearTimeout(speechTimeout);

            speechTimeout = setTimeout(() => {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-CN';
                
                const speedSelectElem = document.getElementById('speedSelect');
                utterance.rate = speedSelectElem ? parseFloat(speedSelectElem.value) : 1.0;

                window.speechSynthesis.speak(utterance);
            }, 50);
        }

        function removePinyinTones(str) {
            if (!str) return '';
            return str.normalize('NFD')
                      .replace(/[\u0300-\u036f]/g, '')
                      .replace(/ü/g, 'v')
                      .replace(/Ü/g, 'v')
                      .toLowerCase();
        }

        function normalizeVietnamese(str) {
            if (!str) return '';
            let s = str.normalize('NFC').toLowerCase();
            s = s.replace(/hoả/g, 'hỏa').replace(/hoà/g, 'hòa').replace(/hoá/g, 'hóa')
                   .replace(/thuỷ/g, 'thủy').replace(/thuý/g, 'thúy');
            return s;
        }

        function cleanString(str) {
            if (!str) return '';
            let noBracket = str.replace(/\([^)]*\)/g, '')
                               .replace(/（[^）]*）/g, '')
                               .replace(/\[[^\]]*\]/g, '')
                               .replace(/【[^】]*】/g, '');
            
            let cleaned = noBracket.normalize('NFC').toLowerCase()
                                   .replace(/[？，！\?,\.!:;""''`~]/g, '') 
                                   .trim().replace(/\s+/g, ' ');
            return normalizeVietnamese(cleaned);
        }

        function splitVariants(str) {
            if (!str) return [];
            let noBracket = str.replace(/\([^)]*\)/g, '')
                               .replace(/（[^）]*）/g, '')
                               .replace(/\[[^\]]*\]/g, '')
                               .replace(/【[^】]*】/g, '');
            return noBracket.split(/[/,;|\n]+/)
                            .map(s => cleanString(s))
                            .filter(s => s.length > 0);
        }

        function autoExpandInput(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = (textarea.scrollHeight) + 'px';
        }

        window.onload = function() {
            const savedData = localStorage.getItem('hsk_vocab_data');
            if (savedData) {
                try { 
                    fullVocabData = JSON.parse(savedData);
                    if(!fullVocabData || fullVocabData.length === 0 || !fullVocabData[0].chinese) {
                        fullVocabData = [...EMBEDDED_VOCAB_DATA];
                    }
                } catch(e) { fullVocabData = [...EMBEDDED_VOCAB_DATA]; }
            } else {
                fullVocabData = [...EMBEDDED_VOCAB_DATA];
            }

            const savedWrongByMode = localStorage.getItem('wrong_words_by_mode');
            if (savedWrongByMode) {
                try { wrongWordsByMode = JSON.parse(savedWrongByMode); } catch(e) {}
            }
            updateWrongCountUI();

            const rangeToElem = document.getElementById('rangeTo');
            if (rangeToElem) rangeToElem.value = fullVocabData.length;
            
            const btnNewQuiz = document.getElementById('btnNewQuiz');
            const btnRetryQuiz = document.getElementById('btnRetryQuiz');
            const btnMistakeQuiz = document.getElementById('btnMistakeQuiz');
            const btnReset = document.getElementById('btnReset');
            const modeSelectElem = document.getElementById('modeSelect');

            if (btnNewQuiz) btnNewQuiz.addEventListener('click', startNewQuiz);
            if (btnRetryQuiz) btnRetryQuiz.addEventListener('click', retryCurrentQuiz);
            if (btnMistakeQuiz) btnMistakeQuiz.addEventListener('click', startMistakeQuiz);
            if (btnReset) btnReset.addEventListener('click', resetAllData);
            
            if (modeSelectElem) {
                modeSelectElem.addEventListener('change', function() {
                    updateWrongCountUI();
                    startNewQuiz();
                });
            }

            startNewQuiz();
        };

        function resetTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
            secondsElapsed = 0;
            isTimerRunning = false;
            updateTimerDisplay();
        }

        function checkAndStartTimer() {
            if (!isTimerRunning) {
                isTimerRunning = true;
                timerInterval = setInterval(() => {
                    secondsElapsed++;
                    updateTimerDisplay();
                }, 1000);
            }
        }

        function stopTimer() {
            clearInterval(timerInterval);
            isTimerRunning = false;
        }

        function updateTimerDisplay() {
            const timerDisplay = document.getElementById('timerDisplay');
            if (!timerDisplay) return;
            const mins = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
            const secs = (secondsElapsed % 60).toString().padStart(2, '0');
            timerDisplay.innerText = `${mins}:${secs}`;
        }

        function updateWrongCountUI() {
            const countElem = document.getElementById('wrongCount');
            const modeSelectElem = document.getElementById('modeSelect');
            const currentMode = modeSelectElem ? modeSelectElem.value : 'chinese_to_viet';
            
            if (countElem && wrongWordsByMode[currentMode]) {
                countElem.innerText = Object.keys(wrongWordsByMode[currentMode]).length;
            }
        }

        const excelFileElem = document.getElementById('excelFile');
        if (excelFileElem) {
            excelFileElem.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;

                const statusText = document.getElementById('loadingStatus');
                if (statusText) { statusText.innerText = "⏳ Đang đọc..."; statusText.style.color = "#ec4899"; }

                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const worksheet = workbook.Sheets[workbook.SheetNames[0]];

                        const cellZ1 = worksheet['Z1'] ? worksheet['Z1'].v.toString().trim() : '';
                        if (cellZ1 !== SECRET_Z1_KEY) {
                            alert("Bản quyền file không hợp lệ hoặc sai mã xác thực. Vui lòng liên hệ Admin để được hỗ trợ!");
                            if (statusText) { statusText.innerText = "❌ Sai mã xác thực bản quyền!"; statusText.style.color = "#dc2626"; }
                            return;
                        }

                        const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });

                        if (!rows || rows.length === 0) {
                            alert("File Excel trống!");
                            return;
                        }

                        let headerRowIndex = 0;
                        for (let i = 0; i < Math.min(rows.length, 5); i++) {
                            const rowStr = rows[i].join(" ").toUpperCase();
                            if (rowStr.includes("HÁN") || rowStr.includes("CHINESE") || rowStr.includes("PINYIN") || rowStr.includes("NGHĨA") || rowStr.includes("LOẠI")) {
                                headerRowIndex = i;
                                break;
                            }
                        }

                        const parsedData = [];
                        for (let i = headerRowIndex + 1; i < rows.length; i++) {
                            const row = rows[i];
                            if (!row || row.length === 0) continue;

                            let chinese = row[1] ? row[1].toString().trim() : (row[0] ? row[0].toString().trim() : '');
                            let type    = row[2] ? row[2].toString().trim() : '';
                            let pinyin  = row[3] ? row[3].toString().trim() : (row[2] ? row[2].toString().trim() : '');
                            let meaning = row[4] ? row[4].toString().trim() : (row[3] ? row[3].toString().trim() : '');

                            if (chinese || meaning) {
                                parsedData.push({ chinese, type, pinyin, meaning });
                            }
                        }

                        if (parsedData.length === 0) {
                            alert("Không tìm thấy dữ liệu từ vựng hợp lệ trong file!");
                            return;
                        }

                        fullVocabData = parsedData;
                        localStorage.setItem('hsk_vocab_data', JSON.stringify(fullVocabData));
                        
                        if (statusText) { 
                            statusText.innerText = `✅ Đã nạp ${fullVocabData.length} từ!`; 
                            statusText.style.color = "#10b981"; 
                        }
                        
                        document.getElementById('rangeFrom').value = 1;
                        document.getElementById('rangeTo').value = fullVocabData.length;
                        sequentialOffset = 0;
                        
                        startNewQuiz();
                    } catch (err) { alert("Lỗi khi đọc file Excel: " + err.message); }
                };
                reader.readAsArrayBuffer(file);
            });
        }

        function startNewQuiz() {
            isMistakeMode = false;
            if (!fullVocabData || fullVocabData.length === 0) fullVocabData = [...EMBEDDED_VOCAB_DATA];
            
            let fromIdx = parseInt(document.getElementById('rangeFrom').value) || 1;
            let toIdx = parseInt(document.getElementById('rangeTo').value) || fullVocabData.length;
            const size = parseInt(document.getElementById('quizSize').value) || 10;
            const shuffleSelectElem = document.getElementById('shuffleSelect');
            const shuffleMode = shuffleSelectElem ? shuffleSelectElem.value : 'random';

            if (fromIdx < 1) fromIdx = 1;
            if (toIdx > fullVocabData.length) toIdx = fullVocabData.length;
            if (fromIdx > toIdx) { let temp = fromIdx; fromIdx = toIdx; toIdx = temp; }

            document.getElementById('rangeFrom').value = fromIdx;
            document.getElementById('rangeTo').value = toIdx;

            const slicedData = fullVocabData.slice(fromIdx - 1, toIdx);

            if (slicedData.length === 0) {
                alert("Khoảng câu chọn không hợp lệ!");
                return;
            }

            let processedData = [];
            if (shuffleMode === 'random') {
                const shuffled = fisherYatesShuffle(slicedData);
                processedData = shuffled.slice(0, Math.min(size, slicedData.length));
            } else {
                if (sequentialOffset >= slicedData.length) sequentialOffset = 0;
                processedData = slicedData.slice(sequentialOffset, sequentialOffset + size);
                sequentialOffset += size;
            }

            currentQuizData = processedData;
            resetTimer(); 
            renderTable();
        }

        function startMistakeQuiz() {
            const modeSelectElem = document.getElementById('modeSelect');
            const currentMode = modeSelectElem ? modeSelectElem.value : 'chinese_to_viet';
            
            const currentWrongMap = wrongWordsByMode[currentMode] || {};
            const keys = Object.keys(currentWrongMap);
            
            if (keys.length === 0) {
                alert("Tuyệt vời! Sổ tay từ sai của chế độ này đang trống.");
                return;
            }
            isMistakeMode = true;
            currentQuizData = keys.map(chinese => currentWrongMap[chinese]);
            resetTimer();
            renderTable();
        }

        const shuffleSelectElem = document.getElementById('shuffleSelect');
        if (shuffleSelectElem) shuffleSelectElem.addEventListener('change', function() { sequentialOffset = 0; });

        function retryCurrentQuiz() { 
            if (currentQuizData.length > 0) {
                resetTimer();
                renderTable();
            } 
        }

        function resetAllData() {
            if (confirm("Bạn có chắc chắn muốn xóa tất cả dữ liệu và sổ từ sai?")) {
                localStorage.removeItem('hsk_vocab_data');
                localStorage.removeItem('wrong_words_by_mode');
                wrongWordsByMode = {
                    "chinese_to_viet": {},
                    "viet_to_chinese": {},
                    "listening_mode": {}
                };
                updateWrongCountUI();
                fullVocabData = [...EMBEDDED_VOCAB_DATA];
                const statusText = document.getElementById('loadingStatus');
                if (statusText) statusText.innerText = "";
                document.getElementById('rangeFrom').value = 1;
                document.getElementById('rangeTo').value = fullVocabData.length;
                sequentialOffset = 0;
                startNewQuiz();
            }
        }

        function renderTable() {
            const tbody = document.getElementById('vocabTable');
            if (!tbody) return;
            const modeSelectElem = document.getElementById('modeSelect');
            const mode = modeSelectElem ? modeSelectElem.value : 'chinese_to_viet';
            tbody.innerHTML = '';

            currentQuizData.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.id = `row_${index}`;
                
                let displayChinese = item.chinese; 
                let displayPinyin  = '***';
                let displayMeaning = '***';

                if (mode === 'chinese_to_viet') {
                    displayPinyin = '***';
                    displayMeaning = '***';
                } else if (mode === 'viet_to_chinese') {
                    displayChinese = '***';
                    displayPinyin = '***';
                    displayMeaning = item.meaning || '---';
                } else if (mode === 'listening_mode') {
                    displayChinese = '***';
                    displayPinyin = '***';
                    displayMeaning = '***';
                }

                tr.innerHTML = `
                    <td class="col-stt">${index + 1}</td>
                    <td class="col-hanzi">
                        <span id="chinese_${index}">${displayChinese}</span>
                        <span id="audio_wrap_${index}"></span>
                    </td>
                    <td class="col-type">${item.type || '---'}</td>
                    <td id="pinyin_${index}" class="col-pinyin">${displayPinyin}</td>
                    <td id="meaning_${index}" class="col-viet">${displayMeaning}</td>
                    <td class="col-input">
                        <textarea id="input_${index}" 
                                rows="1"
                                enterkeyhint="next" 
                                autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false"
                                onfocus="activeAudioText='${item.chinese.replace(/'/g, "\\'")}'"
                                oninput="checkAndStartTimer(); autoExpandInput(this);"
                                onblur="checkAnswer(${index})"
                                onkeydown="handleKeyDown(event, ${index})"></textarea>
                    </td>
                `;

                const audioWrapSpan = tr.querySelector(`#audio_wrap_${index}`);
                if (mode === 'chinese_to_viet' || mode === 'listening_mode') {
                    if(audioWrapSpan) {
                        audioWrapSpan.innerHTML = `<button class="audio-btn" onclick="speakText('${item.chinese.replace(/'/g, "\\'")}')" title="Nghe">🔊</button>`;
                    }
                }

                tbody.appendChild(tr);
            });
            updateStats();

            if (mode === 'listening_mode' && currentQuizData.length > 0) {
                setTimeout(() => {
                    speakText(currentQuizData[0].chinese);
                    activeAudioText = currentQuizData[0].chinese;
                    const firstInput = document.getElementById('input_0');
                    if (firstInput) firstInput.focus();
                }, 300);
            }
        }

        function handleKeyDown(event, index) {
            checkAndStartTimer();
            
            if (event.key === ' ' || event.code === 'Space') {
                const inputElem = document.getElementById(`input_${index}`);
                if (inputElem && !inputElem.value.trim() && activeAudioText) {
                    event.preventDefault();
                    speakText(activeAudioText);
                    return;
                }
            }

            if (event.key === 'Enter' || event.keyCode === 13) {
                event.preventDefault();
                checkAnswer(index); 
                
                const nextInput = document.getElementById(`input_${index + 1}`);
                if (nextInput) {
                    nextInput.focus();
                    nextInput.select(); 

                    const modeSelectElem = document.getElementById('modeSelect');
                    const mode = modeSelectElem ? modeSelectElem.value : 'chinese_to_viet';
                    if (mode === 'listening_mode' && currentQuizData[index + 1]) {
                        speakText(currentQuizData[index + 1].chinese);
                        activeAudioText = currentQuizData[index + 1].chinese;
                    }
                }
            }
        }

        function getSimilarityRatio(str1, str2) {
            const s1 = cleanString(str1);
            const s2 = cleanString(str2);
            if (s1 === s2) return 1.0;
            if (!s1 || !s2) return 0.0;

            const len1 = s1.length;
            const len2 = s2.length;
            const track = Array(len2 + 1).fill(null).map(() => Array(len1 + 1).fill(null));

            for (let i = 0; i <= len1; i += 1) track[0][i] = i;
            for (let j = 0; j <= len2; j += 1) track[j][0] = j;

            for (let j = 1; j <= len2; j += 1) {
                for (let i = 1; i <= len1; i += 1) {
                    const indicator = s1[i - 1] === s2[j - 1] ? 0 : 1;
                    track[j][i] = Math.min(
                        track[j][i - 1] + 1, 
                        track[j - 1][i] + 1, 
                        track[j - 1][i - 1] + indicator 
                    );
                }
            }
            const distance = track[len2][len1];
            const maxLen = Math.max(len1, len2);
            return (maxLen - distance) / maxLen;
        }

        function checkAnswer(index) {
            const inputElem = document.getElementById(`input_${index}`);
            if (!inputElem) return;

            const inputVal = inputElem.value;
            const tr = document.getElementById(`row_${index}`);
            const item = currentQuizData[index];
            const modeSelectElem = document.getElementById('modeSelect');
            const mode = modeSelectElem ? modeSelectElem.value : 'chinese_to_viet';

            if (!inputVal.trim()) {
                if (tr) tr.className = "";
                updateStats();
                return;
            }

            const cleanedInput = cleanString(inputVal);
            let isCorrect = false;

            const chineseVariants = splitVariants(item.chinese);
            const pinyinVariants = splitVariants(item.pinyin);
            const rawPinyinVariants = pinyinVariants.map(p => removePinyinTones(p));
            const cleanInputNoTone = removePinyinTones(cleanedInput);
            const meaningVariants = splitVariants(item.meaning);

            if (mode === 'chinese_to_viet') {
                isCorrect = meaningVariants.some(variant => {
                    const cleanTarget = cleanString(variant);
                    if (cleanedInput === cleanTarget) return true;

                    const subVariants = variant.split(/[/,;|\n]+/).map(s => cleanString(s));
                    if (subVariants.includes(cleanedInput)) return true;

                    let userText = " " + cleanedInput + " ";
                    let targetText = " " + cleanTarget + " ";

                    const fillerWords = [" là ", " có ", " được ", " thì ", " của "];
                    fillerWords.forEach(word => {
                        userText = userText.replaceAll(word, " ");
                        targetText = targetText.replaceAll(word, " ");
                    });

                    const synonyms = [
                        ["bây giờ", "hiện tại"], ["định", "muốn", "tính"],
                        ["tệ", "nghìn", "đồng", "k"], ["ngày mai", "mai"],
                        ["hôm nay", "nay"], ["thời tiết", "trời"]
                    ];
                    synonyms.forEach(group => {
                        const mainWord = group[0];
                        for (let i = 1; i < group.length; i++) {
                            const subWord = group[i];
                            if (subWord) {
                                userText = userText.replaceAll(subWord, mainWord);
                                targetText = targetText.replaceAll(subWord, mainWord);
                            }
                        }
                    });

                    userText = userText.replace(/\s+/g, ' ').trim();
                    targetText = targetText.replace(/\s+/g, ' ').trim();

                    if (userText === targetText) return true;

                    const similarity = getSimilarityRatio(userText, targetText);
                    return similarity >= 0.55;
                });

            } else if (mode === 'viet_to_chinese') {
                isCorrect = chineseVariants.includes(cleanedInput) || 
                            pinyinVariants.includes(cleanedInput) || 
                            rawPinyinVariants.includes(cleanInputNoTone);
            } else if (mode === 'listening_mode') {
                isCorrect = chineseVariants.includes(cleanedInput) || 
                            pinyinVariants.includes(cleanedInput) || 
                            rawPinyinVariants.includes(cleanInputNoTone) ||
                            meaningVariants.some(variant => getSimilarityRatio(cleanedInput, cleanString(variant)) >= 0.55);
            }

            const chineseSpan = document.getElementById(`chinese_${index}`);
            const pinyinSpan = document.getElementById(`pinyin_${index}`);
            const meaningSpan = document.getElementById(`meaning_${index}`);
            const audioWrapSpan = document.getElementById(`audio_wrap_${index}`);

            if (chineseSpan) chineseSpan.innerText = item.chinese;
            if (pinyinSpan) pinyinSpan.innerText = item.pinyin;
            if (meaningSpan) meaningSpan.innerText = item.meaning;
            if (audioWrapSpan) {
                audioWrapSpan.innerHTML = `<button class="audio-btn" onclick="speakText('${item.chinese.replace(/'/g, "\\'")}')" title="Nghe">🔊</button>`;
            }

            let currentWrongMap = wrongWordsByMode[mode] || {};

            if (isCorrect) {
                if (tr) tr.className = 'row-correct';
                speakText(item.chinese);
                
                // CẢI TIẾN: Gõ đúng trong sổ từ sai -> chỉ xóa ngầm khỏi danh sách và cập nhật số đếm, TUYỆT ĐỐI KHÔNG vẽ lại bảng (`renderTable`) để không làm mất con trỏ chuột của anh!
                if (isMistakeMode && currentWrongMap[item.chinese]) {
                    delete currentWrongMap[item.chinese];
                    wrongWordsByMode[mode] = currentWrongMap;
                    localStorage.setItem('wrong_words_by_mode', JSON.stringify(wrongWordsByMode));
                    updateWrongCountUI();
                }
            } else {
                if (tr) tr.className = 'row-wrong';
                currentWrongMap[item.chinese] = item;
                wrongWordsByMode[mode] = currentWrongMap;
                localStorage.setItem('wrong_words_by_mode', JSON.stringify(wrongWordsByMode));
                updateWrongCountUI();
            }

            updateStats();
        }

        function updateStats() {
            const total = currentQuizData.length;
            let done = 0;
            let correct = 0;
            let wrong = 0;

            currentQuizData.forEach((_, index) => {
                const tr = document.getElementById(`row_${index}`);
                if (tr && (tr.classList.contains('row-correct') || tr.className.includes('row-correct'))) {
                    done++;
                    correct++;
                } else if (tr && (tr.classList.contains('row-wrong') || tr.className.includes('row-wrong'))) {
                    done++;
                    wrong++;
                }
            });

            const statTotal = document.getElementById('statTotal');
            const statDone = document.getElementById('statDone');
            const statCorrect = document.getElementById('statCorrect');
            const statWrong = document.getElementById('statWrong');
            const statRate = document.getElementById('statRate');
            const progressBar = document.getElementById('progressBar');

            if (statTotal) statTotal.innerText = total;
            if (statDone) statDone.innerText = done;
            if (statCorrect) statCorrect.innerText = correct;
            if (statWrong) statWrong.innerText = wrong;

            const rate = done > 0 ? ((correct / done) * 100).toFixed(1) : '0.0';
            if (statRate) statRate.innerText = `${rate}%`;

            const percent = total > 0 ? (done / total) * 100 : 0;
            if (progressBar) progressBar.style.width = `${percent}%`;

            if (done === total && total > 0) {
                stopTimer();
            }
        }
    </script>
