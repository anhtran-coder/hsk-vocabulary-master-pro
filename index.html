<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quiz Tiếng Trung</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f8fafc; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #fff; }
        th, td { border: 1px solid #e2e8f0; padding: 12px; text-align: left; }
        th { background: #f1f5f9; }
        
        /* Cập nhật ở đây: Chữ trong ô nhập nằm giữa */
        input[type="text"] {
            width: 92%;
            padding: 8px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
            text-align: center; /* Đưa chữ ra giữa ô nhập */
            outline: none;
            transition: all 0.2s;
        }
        
        input[type="text"]:focus { border-color: #3b82f6; }
        .row-correct { background-color: #dcfce7; }
        .row-wrong { background-color: #fee2e2; }
        .col-status { text-align: center; font-size: 20px; width: 50px; }
        .audio-btn { cursor: pointer; border: none; background: none; font-size: 18px; }
    </style>
</head>
<body>

    <h2>Quiz Học Tiếng Trung</h2>
    <select id="modeSelect">
        <option value="chinese_to_meaning">Hán tự -> Nghĩa</option>
        <option value="pinyin_to_chinese">Pinyin -> Hán tự</option>
        <option value="mixed">Kết hợp</option>
    </select>

    <table id="quizTable">
        <thead>
            <tr>
                <th>Hán Tự</th>
                <th>Pinyin</th>
                <th>Nghĩa</th>
                <th>Ô Nhập</th>
                <th>Kết quả</th>
            </tr>
        </thead>
        <tbody id="quizBody">
            <!-- Dữ liệu sẽ load vào đây -->
        </tbody>
    </table>

    <script>
        // Giả lập dữ liệu quiz
        const currentQuizData = [
            { chinese: "你好", pinyin: "nǐ hǎo", meaning: "Xin chào" },
            { chinese: "谢谢", pinyin: "xiè xie", meaning: "Cảm ơn" }
        ];

        function initQuiz() {
            const tbody = document.getElementById('quizBody');
            tbody.innerHTML = '';
            currentQuizData.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.id = `row_${index}`;
                tr.innerHTML = `
                    <td id="chinese_${index}">?</td>
                    <td id="pinyin_${index}">?</td>
                    <td id="meaning_${index}">?</td>
                    <td>
                        <input type="text" id="input_${index}" oninput="checkInput(${index})" 
                               autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
                    </td>
                    <td class="col-status" id="status_${index}"></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function checkInput(index) {
            const inputElem = document.getElementById(`input_${index}`);
            const rowElem = document.getElementById(`row_${index}`);
            const statusElem = document.getElementById(`status_${index}`);
            const item = currentQuizData[index];
            const userVal = inputElem.value.trim();

            if (userVal === "") {
                rowElem.className = "";
                statusElem.innerText = "";
                return;
            }

            // Logic kiểm tra đơn giản
            const isCorrect = (userVal === item.chinese || userVal === item.pinyin || userVal === item.meaning);

            if (isCorrect) {
                rowElem.className = "row-correct";
                statusElem.innerText = "✅";
                document.getElementById(`chinese_${index}`).innerText = item.chinese;
                document.getElementById(`pinyin_${index}`).innerText = item.pinyin;
                document.getElementById(`meaning_${index}`).innerText = item.meaning;
            } else {
                rowElem.className = "row-wrong";
                statusElem.innerText = "❌";
            }
        }

        // Khởi chạy khi load xong
        initQuiz();
    </script>
</body>
</html>
