<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSK Vocabulary Master</title>
    <!-- Thư viện đọc Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        .row-correct { background-color: #dcfce7; }
        .row-wrong { background-color: #fee2e2; }
        #progressBar { height: 10px; background: green; width: 0%; transition: 0.3s; }
    </style>
</head>
<body>

    <h1>HSK Vocabulary Master</h1>

    <!-- Bảng điều khiển -->
    <div>
        <input type="file" id="excelFile" accept=".xlsx, .xls">
        <button id="btnNewQuiz">Làm mới Quiz</button>
        <button id="btnRetryQuiz">Thử lại</button>
        <button id="btnReset">Reset Mặc định</button>
        <select id="modeSelect">
            <option value="chinese_to_meaning">Hán tự -> Nghĩa</option>
        </select>
        <button id="btnAudioToggle">🔊 Bật âm</button>
        <div id="timerDisplay">00:00</div>
    </div>

    <!-- Thanh tiến độ -->
    <div style="width: 100%; background: #eee; margin: 10px 0;"><div id="progressBar"></div></div>
    
    <!-- Dashboard -->
    <p>Tổng: <span id="statTotal">0</span> | Đúng: <span id="statCorrect">0</span></p>

    <!-- Bảng câu hỏi -->
    <table>
        <thead><tr><th>STT</th><th>Đề bài</th><th>Đáp án</th><th>Trạng thái</th></tr></thead>
        <tbody id="vocabTable"></tbody>
    </table>

    <select id="voiceSelect" style="display:none;"></select>

    <script>
        // --- TOÀN BỘ LOGIC JAVASCRIPT ---
        const SECRET_KEY = "CAMTU2019S2THANHAN2025";
        const EMBEDDED_VOCAB_DATA = [
            {"chinese": "早饭", "type": "Danh từ", "pinyin": "zǎofàn", "meaning": "Bữa sáng"},
            {"chinese": "午饭", "type": "Danh từ", "pinyin": "wǔfàn", "meaning": "Bữa trưa"},
            {"chinese": "姐姐", "type": "Danh từ", "pinyin": "jiějie", "meaning": "Chị gái"}
        ];

        let fullVocabData = JSON.parse(localStorage.getItem('hsk_vocab_data')) || EMBEDDED_VOCAB_DATA;
        let currentQuizData = [];
        let timerInterval = null, secondsElapsed = 0, isTimerRunning = false, isAudioMuted = false;

        function startNewQuiz() {
            currentQuizData = fullVocabData.slice(0, 5).map(item => ({ ...item, userAnswer: '', status: 'pending' }));
            renderQuizTable();
            updateDashboardStats();
            resetTimer();
        }

        function resetTimer() {
            clearInterval(timerInterval);
            secondsElapsed = 0;
            isTimerRunning = false;
            document.getElementById('timerDisplay').innerText = "00:00";
        }

        function renderQuizTable() {
            const tbody = document.getElementById('vocabTable');
            tbody.innerHTML = '';
            currentQuizData.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.className = item.status === 'correct' ? 'row-correct' : (item.status === 'wrong' ? 'row-wrong' : '');
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${item.chinese}</td>
                    <td><input type="text" id="input-${index}" value="${item.userAnswer}" ${item.status === 'correct' ? 'disabled' : ''}></td>
                    <td id="status-${index}">${item.status === 'correct' ? '✅' : '⏳'}</td>
                `;
                tbody.appendChild(tr);
                document.getElementById(`input-${index}`).addEventListener('blur', (e) => handleAnswer(index, e.target.value));
            });
        }

        function handleAnswer(index, val) {
            const item = currentQuizData[index];
            if (val.trim() === item.meaning) {
                item.status = 'correct';
            } else if (val.trim() !== "") {
                item.status = 'wrong';
            }
            renderQuizTable();
            updateDashboardStats();
        }

        function updateDashboardStats() {
            const correct = currentQuizData.filter(i => i.status === 'correct').length;
            document.getElementById('statTotal').innerText = currentQuizData.length;
            document.getElementById('statCorrect').innerText = correct;
            document.getElementById('progressBar').style.width = (correct / currentQuizData.length) * 100 + "%";
        }

        document.getElementById('btnNewQuiz').addEventListener('click', startNewQuiz);
        document.getElementById('btnRetryQuiz').addEventListener('click', startNewQuiz);
        document.getElementById('btnReset').addEventListener('click', () => {
            localStorage.removeItem('hsk_vocab_data');
            fullVocabData = EMBEDDED_VOCAB_DATA;
            startNewQuiz();
        });

        window.onload = startNewQuiz;
    </script>
</body>
</html>
