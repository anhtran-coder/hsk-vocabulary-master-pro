    <script>
        // --- GIẢM XUỐNG 110 CÁNH HOA ĐỂ CHẠY MƯỢT TRÊN ĐIỆN THOẠI, KHÔNG GIẬT LAG ---
        function createSnowflakes() {
            const container = document.getElementById('snowflakeContainer');
            if (!container) return;
            container.innerHTML = ''; // Xóa cũ nếu có
            const icons = ['🌸', '❄', '🌸', '❆', '🌺', '🌸'];
            const count = 110; // Đã giảm từ 220 xuống 110
            
            const fragment = document.createDocumentFragment();

            for (let i = 0; i < count; i++) {
                const flake = document.createElement('div');
                flake.className = 'snowflake';
                flake.innerText = icons[Math.floor(Math.random() * icons.length)];
                
                const leftPos = Math.random() * 100;
                const duration = 6 + Math.random() * 8;
                const delay = Math.random() * 10;
                const size = 0.5 + Math.random() * 0.8;
                const opacity = 0.2 + Math.random() * 0.5;
                
                flake.style.left = `${leftPos}%`;
                flake.style.animationDuration = `${duration}s, 3.5s`;
                flake.style.animationDelay = `${delay}s, ${delay}s`;
                flake.style.fontSize = `${size}em`;
                flake.style.opacity = opacity;
                
                fragment.appendChild(flake);
            }
            container.appendChild(fragment);
        }
        createSnowflakes();

        const SECRET_KEY = "CAMTU2019S2THANHAN2025";

        const EMBEDDED_VOCAB_DATA = [
            {"chinese": "年", "type": "Danh từ", "pinyin": "nián", "meaning": "Năm"},
            {"chinese": "今年", "type": "Danh từ chỉ thời gian", "pinyin": "jīnnián", "meaning": "Năm nay"},
            {"chinese": "明年", "type": "Danh từ chỉ thời gian", "pinyin": "míngnián", "meaning": "Năm sau, sang năm"},
            {"chinese": "后年", "type": "Danh từ chỉ thời gian", "pinyin": "hòunián", "meaning": "Năm sau nữa"},
            {"chinese": "去年", "type": "Danh từ chỉ thời gian", "pinyin": "qùnián", "meaning": "Năm ngoái"},
            {"chinese": "毕业", "type": "Động từ (ly hợp)", "pinyin": "bìyè", "meaning": "Tốt nghiệp"},
            {"chinese": "多", "type": "Phó từ / Tính từ", "pinyin": "duō", "meaning": "Nhiều, hơn"},
            {"chinese": "多大", "type": "Cụm từ hỏi", "pinyin": "duōdà", "meaning": "Bao nhiêu tuổi"},
            {"chinese": "岁", "type": "Lượng từ", "pinyin": "suì", "meaning": "Tuổi"},
            {"chinese": "属", "type": "Động từ", "pinyin": "shǔ", "meaning": "Cầm tinh, thuộc về"}
        ];

        let fullVocabData = [];
        let currentQuizData = [];
        let timerInterval = null;
        let secondsElapsed = 0;
        let isTimerRunning = false;
        let sequentialOffset = 0;
        let isAudioEnabled = true;

        let globalAudio = new Audio();

        const btnAudioToggle = document.getElementById('btnAudioToggle');
        if (btnAudioToggle) {
            btnAudioToggle.addEventListener('click', function() {
                isAudioEnabled = !isAudioEnabled;
                if (isAudioEnabled) {
                    btnAudioToggle.innerHTML = "🔊 Âm thanh";
                    btnAudioToggle.classList.remove('muted');
                    speakText("好");
                } else {
                    btnAudioToggle.innerHTML = "🔇 Âm thanh";
                    btnAudioToggle.classList.add('muted');
                }
            });
        }

        function speakText(text) {
            if (!isAudioEnabled || !text) return;
            
            let pureText = text.split(/[/,;|\n]+/)[0].trim();
            pureText = pureText.split(' ')[0];
            pureText = pureText.replace(/[…….,;:!?()]/g, '');

            if (!pureText) return;

            const cleanText = encodeURIComponent(pureText);
            const voiceSelectElem = document.getElementById('voiceSelect');
            const speedSelectElem = document.getElementById('speedSelect');
            const voiceType = voiceSelectElem ? voiceSelectElem.value : 'google';
            const speed = speedSelectElem ? speedSelectElem.value : '1.0';
            
            let audioUrl = "";
            if (voiceType === 'baidu') {
                audioUrl = `https://fanyi.baidu.com/gettts?lan=zh&text=${cleanText}&spd=3&source=web`;
            } else {
                audioUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${cleanText}&tl=zh-CN&client=tw-ob`;
            }

            globalAudio.pause();
            globalAudio.currentTime = 0;
            globalAudio.src = audioUrl;
            globalAudio.playbackRate = parseFloat(speed);
            globalAudio.play().catch(e => {
                console.log("Audio play error:", e);
            });
        }

        function removePinyinTones(str) {
            if (!str) return '';
            return str.normalize('NFD')
                      .replace(/[\u0300-\u036f]/g, '')
                      .replace(/ü/g, 'v')
                      .replace(/Ü/g, 'v')
                      .toLowerCase();
        }

        function normalizeVietnamese(str) {
            if (!str) return '';
            let s = str.normalize('NFC').toLowerCase();
            s = s.replace(/hoả/g, 'hỏa').replace(/hoà/g, 'hòa').replace(/hoá/g, 'hóa')
                 .replace(/thuỷ/g, 'thủy').replace(/thuý/g, 'thúy');
            return s;
        }

        function cleanString(str) {
            if (!str) return '';
            let cleaned = str.toLowerCase()
                             .replace(/\([^)]*\)/g, '')
                             .replace(/\[[^\]]*\]/g, '')
                             .trim().replace(/\s+/g, ' ');
            return normalizeVietnamese(cleaned);
        }

        function splitVariants(str) {
            if (!str) return [];
            return str.split(/[/,;|\n]+/)
                      .map(s => cleanString(s))
                      .filter(s => s.length > 0);
        }

        window.onload = function() {
            const savedData = localStorage.getItem('hsk_vocab_data');
            if (savedData) {
                try { 
                    fullVocabData = JSON.parse(savedData);
                    if(!fullVocabData || fullVocabData.length === 0 || !fullVocabData[0].chinese) {
                        fullVocabData = [...EMBEDDED_VOCAB_DATA];
                    }
                } catch(e) { fullVocabData = [...EMBEDDED_VOCAB_DATA]; }
            } else {
                fullVocabData = [...EMBEDDED_VOCAB_DATA];
            }
            const rangeToElem = document.getElementById('rangeTo');
            if (rangeToElem) rangeToElem.value = fullVocabData.length;
            
            const btnNewQuiz = document.getElementById('btnNewQuiz');
            const btnRetryQuiz = document.getElementById('btnRetryQuiz');
            const btnReset = document.getElementById('btnReset');

            if (btnNewQuiz) btnNewQuiz.addEventListener('click', startNewQuiz);
            if (btnRetryQuiz) btnRetryQuiz.addEventListener('click', retryCurrentQuiz);
            if (btnReset) btnReset.addEventListener('click', resetAllData);

            startNewQuiz();
        };

        function resetTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
            secondsElapsed = 0;
            isTimerRunning = false;
            updateTimerDisplay();
        }

        function checkAndStartTimer() {
            if (!isTimerRunning) {
                isTimerRunning = true;
                timerInterval = setInterval(() => {
                    secondsElapsed++;
                    updateTimerDisplay();
                }, 1000);
            }
        }

        function stopTimer() {
            clearInterval(timerInterval);
            isTimerRunning = false;
        }

        function updateTimerDisplay() {
            const timerDisplay = document.getElementById('timerDisplay');
            if (!timerDisplay) return;
            const mins = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
            const secs = (secondsElapsed % 60).toString().padStart(2, '0');
            timerDisplay.innerText = `${mins}:${secs}`;
        }

        const excelFileElem = document.getElementById('excelFile');
        if (excelFileElem) {
            excelFileElem.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;

                const statusText = document.getElementById('loadingStatus');
                if (statusText) { statusText.innerText = "⏳ Đang đọc..."; statusText.style.color = "#ec4899"; }

                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const worksheet = workbook.Sheets[workbook.SheetNames[0]];

                        const cellZ1 = worksheet['Z1'] ? worksheet['Z1'].v.toString().trim() : '';
                        const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });

                        if (!rows || rows.length < 2) {
                            alert("File Excel không có dữ liệu!");
                            return;
                        }

                        let hasValidKey = false;
                        if (cellZ1 === SECRET_KEY) {
                            hasValidKey = true;
                        } else if (rows[0]) {
                            for (let col = 0; col < rows[0].length; col++) {
                                if (rows[0][col] && rows[0][col].toString().trim() === SECRET_KEY) {
                                    hasValidKey = true;
                                    break;
                                }
                            }
                        }

                        if (!hasValidKey) {
                            alert("❌ TRUY CẬP BỊ TỪ CHỐI!\n\nFile Excel không đúng mã khóa ở ô Z1.");
                            document.getElementById('excelFile').value = '';
                            if (statusText) statusText.innerText = "";
                            return;
                        }

                        let headerRowIndex = 0;
                        for (let i = 0; i < Math.min(rows.length, 5); i++) {
                            const rowStr = rows[i].join(" ").toUpperCase();
                            if (rowStr.includes("CHENESE") || rowStr.includes("CHINESE") || rowStr.includes("PINYIN") || rowStr.includes("MEANING")) {
                                headerRowIndex = i;
                                break;
                            }
                        }

                        const headers = rows[headerRowIndex].map(h => h.toString().trim().toUpperCase());
                        let colChinese = -1, colType = -1, colPinyin = -1, colMeaning = -1;

                        headers.forEach((h, idx) => {
                            if (h.includes('INPUT')) return;
                            if ((h.includes('CHENESE') || h.includes('CHINESE') || h.includes('HÁN')) && colChinese === -1) colChinese = idx;
                            else if (h.includes('TYPE') || h.includes('LOẠI TỪ')) colType = idx;
                            else if (h.includes('PINYIN') || h.includes('PHIÊN ÂM')) colPinyin = idx;
                            else if (h.includes('MEANING') || h.includes('TIẾNG VIỆT') || h.includes('NGHĨA')) colMeaning = idx;
                        });

                        if (colChinese === -1) colChinese = 1;
                        if (colType === -1) colType = 2;
                        if (colPinyin === -1) colPinyin = 3;
                        if (colMeaning === -1) colMeaning = 4;

                        const parsedData = [];
                        for (let i = headerRowIndex + 1; i < rows.length; i++) {
                            const row = rows[i];
                            if (!row || row.length === 0) continue;

                            const chinese = row[colChinese] ? row[colChinese].toString().trim() : '';
                            const type    = row[colType]    ? row[colType].toString().trim() : '';
                            const pinyin  = row[colPinyin]  ? row[colPinyin].toString().trim() : '';
                            const meaning = row[colMeaning] ? row[colMeaning].toString().trim() : '';

                            if (chinese || meaning) {
                                parsedData.push({ chinese, type, pinyin, meaning });
                            }
                        }

                        if (parsedData.length === 0) {
                            alert("Không tìm thấy dữ liệu từ vựng hợp lệ!");
                            return;
                        }

                        fullVocabData = parsedData;
                        localStorage.setItem('hsk_vocab_data', JSON.stringify(fullVocabData));
                        
                        if (statusText) { 
                            statusText.innerText = `✅ Đã nạp ${fullVocabData.length} từ!`; 
                            statusText.style.color = "#10b981"; 
                        }
                        
                        document.getElementById('rangeFrom').value = 1;
                        document.getElementById('rangeTo').value = fullVocabData.length;
                        sequentialOffset = 0;
                        
                        startNewQuiz();
                    } catch (err) { alert("Lỗi khi đọc file Excel: " + err.message); }
                };
                reader.readAsArrayBuffer(file);
            });
        }

        function startNewQuiz() {
            if (!fullVocabData || fullVocabData.length === 0) fullVocabData = [...EMBEDDED_VOCAB_DATA];
            
            let fromIdx = parseInt(document.getElementById('rangeFrom').value) || 1;
            let toIdx = parseInt(document.getElementById('rangeTo').value) || fullVocabData.length;
            const size = parseInt(document.getElementById('quizSize').value) || 10;
            const shuffleSelectElem = document.getElementById('shuffleSelect');
            const shuffleMode = shuffleSelectElem ? shuffleSelectElem.value : 'random';

            if (fromIdx < 1) fromIdx = 1;
            if (toIdx > fullVocabData.length) toIdx = fullVocabData.length;
            if (fromIdx > toIdx) { let temp = fromIdx; fromIdx = toIdx; toIdx = temp; }

            document.getElementById('rangeFrom').value = fromIdx;
            document.getElementById('rangeTo').value = toIdx;

            const slicedData = fullVocabData.slice(fromIdx - 1, toIdx);

            if (slicedData.length === 0) {
                alert("Khoảng câu chọn không hợp lệ!");
                return;
            }

            let processedData = [];
            if (shuffleMode === 'random') {
                const shuffled = [...slicedData].sort(() => 0.5 - Math.random());
                processedData = shuffled.slice(0, Math.min(size, slicedData.length));
            } else {
                if (sequentialOffset >= slicedData.length) sequentialOffset = 0;
                processedData = slicedData.slice(sequentialOffset, sequentialOffset + size);
                sequentialOffset += size;
            }

            currentQuizData = processedData;
            resetTimer(); 
            renderTable();
        }

        const shuffleSelectElem = document.getElementById('shuffleSelect');
        if (shuffleSelectElem) shuffleSelectElem.addEventListener('change', function() { sequentialOffset = 0; });
        
        const modeSelectElem = document.getElementById('modeSelect');
        if (modeSelectElem) modeSelectElem.addEventListener('change', function() { renderTable(); });

        function retryCurrentQuiz() { 
            if (currentQuizData.length > 0) {
                resetTimer();
                renderTable();
            } 
        }

        function resetAllData() {
            if (confirm("Bạn có chắc chắn muốn xóa dữ liệu đã lưu?")) {
                localStorage.removeItem('hsk_vocab_data');
                fullVocabData = [...EMBEDDED_VOCAB_DATA];
                const statusText = document.getElementById('loadingStatus');
                if (statusText) statusText.innerText = "";
                document.getElementById('rangeFrom').value = 1;
                document.getElementById('rangeTo').value = fullVocabData.length;
                sequentialOffset = 0;
                startNewQuiz();
            }
        }

        function renderTable() {
            const tbody = document.getElementById('vocabTable');
            if (!tbody) return;
            const modeElem = document.getElementById('modeSelect');
            const mode = modeElem ? modeElem.value : 'chinese_to_meaning';
            tbody.innerHTML = '';

            currentQuizData.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.id = `row_${index}`;
                
                let displayChinese = '***';
                let displayPinyin  = '***';
                let displayMeaning = '***';
                let audioBtnHtml = '';

                // Nếu chọn chế độ kiểm tra nghĩa tiếng Việt (đề bài hiện nghĩa, gõ chữ Hán/Pinyin)
                if (mode === 'chinese_to_meaning') {
                    displayMeaning = item.meaning || '---';
                } else {
                    displayMeaning = item.meaning || '---';
                }

                tr.innerHTML = `
                    <td class="col-stt">${index + 1}</td>
                    <td class="col-hanzi">
                        <span id="chinese_${index}">${displayChinese}</span>
                        <span id="audio_wrap_${index}">${audioBtnHtml}</span>
                    </td>
                    <td class="col-type">${item.type || '-'}</td>
                    <td id="pinyin_${index}" class="col-pinyin">${displayPinyin}</td>
                    <td id="meaning_${index}" class="col-viet">${displayMeaning}</td>
                    <td class="col-input">
                        <input type="text" id="input_${index}" 
                               enterkeyhint="next" 
                               autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false"
                               oninput="checkAndStartTimer()"
                               onblur="checkAnswer(${index})"
                               onkeydown="handleKeyDown(event, ${index})">
                    </td>
                    <td id="status_${index}" class="col-status">-</td>
                `;
                tbody.appendChild(tr);
            });
            updateStats();
        }

        function handleKeyDown(event, index) {
            checkAndStartTimer();
            if (event.key === 'Enter' || event.keyCode === 13) {
                event.preventDefault();
                checkAnswer(index); 
                
                const nextInput = document.getElementById(`input_${index + 1}`);
                if (nextInput) {
                    nextInput.focus();
                    nextInput.select();
                }
            }
        }

        function checkAnswer(index) {
            const inputElem = document.getElementById(`input_${index}`);
            if (!inputElem) return;

            const inputVal = inputElem.value;
            const tr = document.getElementById(`row_${index}`);
            const statusTd = document.getElementById(`status_${index}`);
            const item = currentQuizData[index];

            if (!inputVal.trim()) {
                if (tr) tr.className = "";
                if (statusTd) {
                    statusTd.innerText = "-";
                    statusTd.style.color = "inherit";
                }
                return;
            }

            const cleanedInput = cleanString(inputVal);
            let isCorrect = false;

            const chineseVariants = splitVariants(item.chinese);
            const pinyinVariants = splitVariants(item.pinyin);
            const rawPinyinVariants = pinyinVariants.map(p => removePinyinTones(p));
            const cleanInputNoTone = removePinyinTones(cleanedInput);
            const meaningVariants = splitVariants(item.meaning);

            // Kiểm tra khớp với Hán tự, Pinyin hoặc nghĩa tiếng Việt (để tránh lỗi gõ tiếng Việt bị báo sai)
            isCorrect = chineseVariants.includes(cleanedInput) || 
                        pinyinVariants.includes(cleanedInput) || 
                        rawPinyinVariants.includes(cleanInputNoTone) ||
                        meaningVariants.includes(cleanedInput);

            const chineseSpan = document.getElementById(`chinese_${index}`);
            const pinyinSpan = document.getElementById(`pinyin_${index}`);
            const audioWrapSpan = document.getElementById(`audio_wrap_${index}`);

            if (isCorrect) {
                if (tr) tr.className = 'row-correct';
                if (statusTd) statusTd.innerHTML = '✅';
                
                if (chineseSpan) chineseSpan.innerText = item.chinese;
                if (pinyinSpan) pinyinSpan.innerText = item.pinyin;
                if (audioWrapSpan) {
                    audioWrapSpan.innerHTML = `<button class="audio-btn" onclick="speakText('${item.chinese.replace(/'/g, "\\'")}')" title="Nghe">🔊</button>`;
                }
                
                speakText(item.chinese);
            } else {
                if (tr) tr.className = 'row-wrong';
                if (statusTd) statusTd.innerHTML = '❌';

                if (chineseSpan) chineseSpan.innerText = item.chinese;
                if (pinyinSpan) pinyinSpan.innerText = item.pinyin;
                if (audioWrapSpan) {
                    audioWrapSpan.innerHTML = `<button class="audio-btn" onclick="speakText('${item.chinese.replace(/'/g, "\\'")}')" title="Nghe">🔊</button>`;
                }
            }

            updateStats();
        }

        function updateStats() {
            const total = currentQuizData.length;
            let done = 0;
            let correct = 0;
            let wrong = 0;

            currentQuizData.forEach((_, index) => {
                const tr = document.getElementById(`row_${index}`);
                if (tr && tr.classList.contains('row-correct')) {
                    done++;
                    correct++;
                } else if (tr && tr.classList.items && tr.classList.contains('row-wrong')) {
                    done++;
                    wrong++;
                } else if (tr && tr.className.includes('row-wrong')) {
                    done++;
                    wrong++;
                }
            });

            const statTotal = document.getElementById('statTotal');
            const statDone = document.getElementById('statDone');
            const statCorrect = document.getElementById('statCorrect');
            const statWrong = document.getElementById('statWrong');
            const statRate = document.getElementById('statRate');
            const progressBar = document.getElementById('progressBar');

            if (statTotal) statTotal.innerText = total;
            if (statDone) statDone.innerText = done;
            if (statCorrect) statCorrect.innerText = correct;
            if (statWrong) statWrong.innerText = wrong;

            const rate = done > 0 ? ((correct / done) * 100).toFixed(1) : '0.0';
            if (statRate) statRate.innerText = `${rate}%`;

            const percent = total > 0 ? (done / total) * 100 : 0;
            if (progressBar) progressBar.style.width = `${percent}%`;

            if (done === total && total > 0) {
                stopTimer();
            }
        }
    </script>
